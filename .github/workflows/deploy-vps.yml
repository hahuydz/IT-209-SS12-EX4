name: Deploy Spring Boot to VPS via SSH

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-vps:
    name: Thực thi Triển khai VPS từ xa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Giả lập kết nối và triển khai VPS qua SSH an toàn
        run: |
          echo "Đang kết nối tới máy chủ VPS giả lập..."
          echo "Kéo Docker Image từ GHCR thành công!"
          echo "Khởi chạy container my-app trên cổng 8080 thành công!"
          echo "Triển khai hoàn tất!"
